<title>HESABO Simulator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f2f5f1; --surface:#ffffff; --surface-2:#eaf0ea; --surface-3:#dfe7df;
  --border:#d5ddd6; --text:#16211c; --text-2:#4f5c56; --muted:#84908a;
  --accent:#0e8577; --accent-ink:#ffffff; --accent-soft:#d9f0ec; --accent-soft-ink:#075f55;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#e2f5e2; --warn-soft:#fff2d6; --serious-soft:#fde6dc; --crit-soft:#fbe1e1;
  --wa-bg:#e4ddd4; --wa-out:#d9fdd3; --wa-in:#ffffff; --wa-head:#075e54; --wa-head-ink:#ffffff; --wa-tick:#4fb3ff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(22,33,28,.06),0 4px 14px rgba(22,33,28,.06);
  --font:'IBM Plex Sans Arabic','Segoe UI',system-ui,-apple-system,sans-serif;
  --display:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1412; --surface:#171d1a; --surface-2:#1e2622; --surface-3:#28322d;
    --border:#2c3731; --text:#e5ebe7; --text-2:#aab5ae; --muted:#7c877f;
    --accent:#3ab5a4; --accent-ink:#06201c; --accent-soft:#163a35; --accent-soft-ink:#8fdccf;
    --good-ink:#0ca30c;
    --good-soft:#153a15; --warn-soft:#3d3010; --serious-soft:#3f2418; --crit-soft:#3d1a1a;
    --wa-bg:#0b141a; --wa-out:#005c4b; --wa-in:#202c33; --wa-head:#1f2c34; --wa-head-ink:#e9edef;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --grid:#2c2c2a; --axis:#383835;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1412; --surface:#171d1a; --surface-2:#1e2622; --surface-3:#28322d;
  --border:#2c3731; --text:#e5ebe7; --text-2:#aab5ae; --muted:#7c877f;
  --accent:#3ab5a4; --accent-ink:#06201c; --accent-soft:#163a35; --accent-soft-ink:#8fdccf;
  --good-ink:#0ca30c;
  --good-soft:#153a15; --warn-soft:#3d3010; --serious-soft:#3f2418; --crit-soft:#3d1a1a;
  --wa-bg:#0b141a; --wa-out:#005c4b; --wa-in:#202c33; --wa-head:#1f2c34; --wa-head-ink:#e9edef;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#2c2c2a; --axis:#383835;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;direction:rtl}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px;font-weight:800}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.t2{color:var(--text-2)}
.small{font-size:12px}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.nav{background:var(--surface);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:8px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.brand .name{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
.brand .sub{font-size:11px;color:var(--muted)}
.nav-group{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:10px 10px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;border:0;background:none;width:100%;text-align:start}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:600}
.nav-item .ic{width:20px;text-align:center;font-size:15px;flex:none}
.nav-item .badge{margin-inline-start:auto;background:var(--crit);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.nav-item .badge.zero{display:none}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.topbar h1{font-size:19px}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--good)} .pill.warn .dot{background:var(--warn)} .pill.bad .dot{background:var(--crit)}
.content{padding:20px;overflow:auto;flex:1;min-height:0}
.content > * + *{margin-top:16px}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{flex:1}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good-ink)}
.btn.danger{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good-ink)}
.tag.warn{background:var(--warn-soft);color:#7a5200}
.tag.serious{background:var(--serious-soft);color:#8a3a1a}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.info{background:var(--accent-soft);color:var(--accent-soft-ink)}
:root[data-theme="dark"] .tag.warn,:root:not([data-theme="light"]) .tag.warn{color:#fab219}
:root[data-theme="dark"] .tag.serious{color:#ec835a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.serious{color:#ec835a}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.stat .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat .val{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.stat .sub{font-size:12px;color:var(--text-2);margin-top:4px}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:12px;position:sticky;top:0;z-index:1}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:end}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{min-width:220px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
pre.json{background:var(--surface-2);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:20px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50;font-weight:600;opacity:0;transform:translateY(8px);transition:.25s}
.toast.show{opacity:1;transform:none}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-start;z-index:40}
.drawer .panel{width:min(560px,100%);background:var(--surface);height:100%;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.drawer .panel > * + *{margin-top:14px}
.callout{padding:12px 14px;border-radius:8px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:13px}
.callout.warn{background:var(--warn-soft);color:#7a5200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .callout.warn{color:#fab219}}
:root[data-theme="dark"] .callout.warn{color:#fab219}
.steps-list{display:grid;gap:8px}
.check{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--text-2);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg text{font-family:var(--font)}

/* ---------- chat ---------- */
.chat-layout{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start}
.sender-box{display:grid;gap:8px;margin-bottom:12px}
.phone{border-radius:30px;border:9px solid #1a1f1d;background:var(--wa-bg);height:660px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);position:relative}
.phone .wa-head{background:var(--wa-head);color:var(--wa-head-ink);padding:12px 14px;display:flex;align-items:center;gap:10px}
.phone .wa-head .av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.phone .wa-head .nm{font-weight:700;font-size:14px;line-height:1.2}
.phone .wa-head .st{font-size:11px;opacity:.85}
.wa-msgs{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.bubble{max-width:86%;padding:7px 10px 5px;border-radius:9px;font-size:13.5px;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word;position:relative}
.bubble.out{align-self:flex-end;background:var(--wa-out);border-start-end-radius:2px}
.bubble.in{align-self:flex-start;background:var(--wa-in);border-start-start-radius:2px}
.bubble.in.notif-b{border-inline-start:3px solid var(--s2)}
.bubble.in.human{border-inline-start:3px solid var(--s7)}
.bubble .who{font-size:10.5px;color:var(--s2);font-weight:700;margin-bottom:2px}
.bubble.in.human .who{color:var(--s7)}
.typing{align-self:flex-start}
.bubble.sys{align-self:center;background:var(--surface-2);color:var(--text-2);font-size:12px;border-radius:8px;box-shadow:none;max-width:92%;text-align:center}
.bubble .meta{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:10.5px;color:var(--muted);margin-top:2px}
.bubble .meta .tick{color:var(--wa-tick)}
.bubble .attach{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.05);border-radius:6px;padding:6px 8px;margin-top:4px;font-size:12.5px}
.bubble .attach .ico{font-size:20px}
.bubble .btns{display:grid;gap:4px;margin-top:6px}
.bubble .btns button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px;color:var(--accent);font-weight:600}
.typing{align-self:flex-end;background:var(--wa-in);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--muted)}
.wa-compose{display:flex;gap:6px;padding:8px;background:var(--surface-2);align-items:center}
.wa-compose input{flex:1;border-radius:20px;padding:9px 14px;font-size:14px}
.wa-compose button{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:16px;flex:none}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 8px 2px;background:var(--surface-2);scrollbar-width:thin}
.quick button{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--text-2)}
.quick button:hover{color:var(--accent);border-color:var(--accent)}
.trace-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.trace{display:grid;gap:8px}
.step{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start}
.step .no{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;font-size:12px;font-weight:700}
.step.ok .no{background:var(--good-soft);color:var(--good-ink)}
.step.warn .no{background:var(--warn-soft);color:#7a5200}
.step.bad .no{background:var(--crit-soft);color:var(--crit)}
.step .ttl{font-weight:700}
.step .dur{font-family:var(--mono);font-size:11px;color:var(--muted)}
.step .det{grid-column:2 / span 2;font-size:12.5px;color:var(--text-2)}
.step .det pre{margin-top:6px}
.step details summary{cursor:pointer;color:var(--accent);font-size:12px}
.notif{border-inline-start:3px solid var(--s2);padding:8px 10px;background:var(--surface-2);border-radius:6px;font-size:12.5px;display:grid;gap:2px}
.notif b{color:var(--text)}
.engine-switch{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.engine-switch button{border:0;background:var(--surface);padding:6px 10px;font-size:12px;color:var(--text-2)}
.engine-switch button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* ---------- approvals ---------- */
.appr{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:14px;display:grid;gap:10px}
.appr .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.appr .hd .ty{font-weight:700}
.appr .body{background:var(--surface-2);border-radius:8px;padding:10px}

/* ---------- tests ---------- */
.prog{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.res-ok{color:var(--good-ink);font-weight:700}
.res-bad{color:var(--crit);font-weight:700}

/* ---------- guide ---------- */
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
.flow span{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.flow em{font-style:normal;color:var(--muted)}
.prose{max-width:72ch;line-height:1.8}
.prose > * + *{margin-top:10px}
.prose ul,.prose ol{margin:0;padding-inline-start:22px}
.prose li{margin:4px 0}

@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .nav{flex-direction:row;overflow-x:auto;padding:8px;border-inline-start:0;border-bottom:1px solid var(--border);align-items:center}
  .brand{border:0;margin:0;padding:4px 8px}
  .brand .sub{display:none}
  .nav-group{display:none}
  .nav-item{width:auto;white-space:nowrap;padding:6px 10px}
  .chat-layout{grid-template-columns:1fr}
  .grid.c4,.grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phone{height:600px}
}
@media (max-width:560px){
  .content{padding:14px 16px}
  .grid.c4,.grid.c3,.grid.c2{grid-template-columns:1fr}
  .phone{height:560px;border-width:6px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  <nav class="nav" id="nav">

    <button class="nav-item" data-screen="payments"><span class="ic">💳</span>المدفوعات</button>
    <button class="nav-item" data-screen="quotations"><span class="ic">📝</span>عروض الأسعار</button>
    <button class="nav-item" data-screen="leads"><span class="ic">🧲</span>الفرص والأوامر</button>
    <button class="nav-item" data-screen="products"><span class="ic">🛠️</span>الخدمات والأسعار</button>
    <div class="nav-group">التحقق والقياس</div>
    <button class="nav-item" data-screen="tests"><span class="ic">🧪</span>اختبار السيناريوهات</button>
    <button class="nav-item" data-screen="kpi"><span class="ic">📈</span>مؤشرات الأداء</button>

  </nav>
  <div class="main">
    <div class="topbar">
      <h1 id="screen-title">محاكي واتساب</h1>
      <span class="spacer"></span>
      <span class="pill" id="ai-pill"><span class="dot"></span><span id="ai-pill-txt">جاري فحص محرك الـAI…</span></span>
      <span class="pill" id="data-pill"><span class="dot"></span><span id="data-pill-txt">بيانات افتراضية</span></span>
    </div>
    <div class="content" id="content"></div>

  const orders = quotations.filter(q=>q.status==='accepted').map((q,i)=>({ id:'SO-'+(501+i), quotationId:q.id, customerId:q.customerId, date:fmtDate(addDays(q.date, 3)), total:q.total, status: pick(rng,['open','in_progress','done','done']) }));

/* ---------- store ---------- */
const DEFAULT_SETTINGS = {
  companyName:'شركة تجريبية للقص والكور', botName:'مساعد حسابو', currency:'ريال', vat:15,
  aiMode:'auto',            // auto | real | rules
  approvals:{ CREATE_INVOICE:true, RECORD_PAYMENT:true, CREATE_CUSTOMER:false, SEND_QUOTATION:true },

let S = null;
function freshState(){
  const seed = generateSeed();
  return Object.assign(seed, {
    settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
    conversations:{},   // phone -> {messages:[], context:null, unread:0}
    approvals:[], handoffs:[], audit:[], requests:[], testResults:null,
    counters:{inv: 1001+seed.invoices.length, pay: 3001+seed.payments.length, qt: 2001+seed.quotations.length, ld: 401+seed.leads.length, so: 501+seed.orders.length, ap:1, ho:1, cust:101},

function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw){ const st = JSON.parse(raw); if (st && st.version===1 && st.customers) { S = st; S.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), S.settings||{}); S.settings.approvals = Object.assign({}, DEFAULT_SETTINGS.approvals, S.settings.approvals||{}); return; } } } catch(e){}
  S = freshState();
}
let _saveT = null;
function save(){ clearTimeout(_saveT); _saveT = setTimeout(()=>{ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} }, 250); }
function resetAll(){ S = freshState(); try{ localStorage.removeItem(STORE_KEY);}catch(e){} save(); }

/* ---------- derived accounting helpers ---------- */
function invoiceStatus(inv){
  if (inv.status === 'draft') return 'draft';
  if (inv.remaining <= 0) return 'paid';
  const overdue = inv.dueDate < fmtDate(TODAY);
  if (inv.paid > 0) return overdue ? 'overdue' : 'partial';
  return overdue ? 'overdue' : 'unpaid';
}
const STATUS_AR = { paid:'مدفوعة', partial:'مدفوعة جزئياً', unpaid:'غير مدفوعة', overdue:'متأخرة', draft:'مسودة',
  sent:'مرسل', accepted:'مقبول', rejected:'مرفوض', expired:'منتهي', pending_approval:'بانتظار الاعتماد',
  new:'جديد', contacted:'تم التواصل', quoted:'تم التسعير', won:'تم الفوز', lost:'خسارة',
  open:'مفتوح', in_progress:'قيد التنفيذ', done:'منتهي', pending:'معلق', approved:'معتمد', resolved:'تم الحل', active:'نشط', blocked:'موقوف' };
const STATUS_TAG = { paid:'good', partial:'warn', unpaid:'info', overdue:'crit', draft:'', sent:'info', accepted:'good', rejected:'crit', expired:'', pending_approval:'warn', new:'info', contacted:'warn', quoted:'info', won:'good', lost:'crit', open:'info', in_progress:'warn', done:'good', pending:'warn', approved:'good', resolved:'good', active:'good', blocked:'crit' };
const tagOf = st => `<span class="tag ${STATUS_TAG[st]||''}">${STATUS_AR[st]||st}</span>`;

function customerInvoices(cid){ return S.invoices.filter(i => i.customerId===cid && i.status!=='draft'); }
function customerBalance(cid){ const inv = customerInvoices(cid); return { total: sum(inv, i=>i.amount), paid: sum(inv, i=>i.paid), remaining: sum(inv, i=>i.remaining), overdue: sum(inv.filter(i=>invoiceStatus(i)==='overdue'), i=>i.remaining), count: inv.length }; }
function customerByPhone(phone){ return S.customers.find(c => c.phone === phone); }
function userByPhone(phone){ return S.users.find(u => u.phone === phone); }
function customerName(cid){ const c = byId(S.customers, cid); return c ? c.company : cid; }
function productById(id){ return PRODUCTS.find(p=>p.id===id); }

/* actor resolution: who is "sending" from a given phone */
function resolveActor(phone){
  const u = userByPhone(phone); if (u) return { role:u.role, name:u.name, id:u.id, phone, user:u };
  const c = customerByPhone(phone); if (c) return { role:'customer', name:c.name, id:c.id, phone, customer:c };
  return { role:'unknown', name:'رقم غير معروف', id:null, phone };
}

/* audit + request log */
function audit(actor, action, entity, entityId, details){ S.audit.unshift({ ts:new Date().toISOString(), actor: actor||'system', action, entity, entityId:entityId||'', details: details||'' }); if (S.audit.length>2000) S.audit.length=2000; save(); }
function logRequest(r){ S.requests.unshift(Object.assign({ts:new Date().toISOString()}, r)); if (S.requests.length>5000) S.requests.length=5000; save(); }

/* conversations */
function conv(phone){ if (!S.conversations[phone]) S.conversations[phone] = { messages:[], context:null }; return S.conversations[phone]; }
function pushMsg(phone, dir, text, meta){ const m = { id:uid(), dir, text, ts:new Date().toISOString(), meta: meta||{} }; conv(phone).messages.push(m); save(); return m; }

<script>
/* =====================================================================

/* ---------- A. normalisation & entity extraction ---------- */
function norm(s){
  return String(s||'').toLowerCase()
    .replace(/(\d)[,،](\d)/g,'$1$2')
    .replace(/[ً-ْـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[،,؟?!.:;()\[\]"'«»]/g,' ')
    .replace(/\s+/g,' ').trim();
}
const CITY_N = CITIES.map(c => ({ n: norm(c), name:c }));
function matchProduct(text){
  const n = norm(text); if (!n) return null;
  // diameter-specific coring
  if (/كور|coring|تخريم|ثقب/.test(n)){ if (/\b200\b/.test(n)) return productById('P-06'); if (/\b150\b/.test(n)) return productById('P-05'); return productById('P-04'); }
  if (/ارضي|floor/.test(n)) return productById('P-03');
  if (/سلك|واير|wire/.test(n)) return productById('P-02');
  for (const p of PRODUCTS){ for (const k of p.keys){ if (k && n.includes(norm(k))) return p; } }
  if (/^p-?\d\d$/.test(n)) return productById(n.toUpperCase().replace(/^P(\d)/,'P-$1'));
  return null;
}
function unitNorm(u){
  u = norm(u||'');
  if (/مربع|م2|م²|²/.test(u)) return 'م²';
  if (/مكعب|م3|م³|³/.test(u)) return 'م³';
  if (/نقط|ثقب|ثقوب|فتح|كور/.test(u)) return 'نقطة';
  if (/عدد|قطع|حب/.test(u)) return 'عدد';
  if (/متر|م ?ط|^م$/.test(u)) return 'م.ط';
  return u || null;
}
function findCustomerInText(n){
  let best = null;
  for (const c of S.customers){
    const core = norm(c.core);
    if (core.length >= 3 && n.includes(core) && (!best || core.length > best.len)) best = { c, len: core.length };
    const nm = norm(c.name).split(' ');
    if (nm.length===2 && n.includes(nm[0]) && n.includes(nm[1]) && (!best || 99 > best.len)) best = { c, len: 99 };
    const idm = n.match(/c-?0*(\d{1,3})\b/); if (idm && c.id === 'C-'+String(idm[1]).padStart(3,'0')) return c;
  }
  return best ? best.c : null;
}
function extractEntities(raw){
  const n = norm(raw); const e = {};
  let m;
  if ((m = n.match(/(?:فاتور[هة]|فواتير|inv)[\s#:\-]*(?:رقم\s*)?#?\s*(\d{3,6})/))) e.invoice_no = +m[1];
  else if ((m = n.match(/inv[\s\-]?(\d{3,6})/))) e.invoice_no = +m[1];
  if ((m = n.match(/(?:عرض (?:ال)?سعر|عرض|qt)[\s#:\-]*(?:رقم\s*)?#?\s*(\d{4})\b/))) e.quotation_no = +m[1];
  else if ((m = n.match(/qt[\s\-]?(\d{4})/))) e.quotation_no = +m[1];
  if ((m = n.match(/(\d+(?:\.\d+)?)\s*(?:الف|ألف|k)(?=\s|$)/))) e.amount = Math.round(+m[1]*1000);
  else if ((m = n.match(/(\d{2,9}(?:\.\d+)?)\s*(?:ريال|ر\s?س|sar|جنيه|درهم)/))) e.amount = +m[1];
  if ((m = n.match(/(\d+(?:\.\d+)?)\s*(متر مربع|متر مكعب|متر طولي|م\.?ط|م ?2|م²|م ?3|م³|متر|م(?=\s|$)|نقطه|نقاط|نقط|عدد|قطعه|قطع|ثقب|ثقوب|فتحه|فتحات|حبه|كور(?=\s|$))/))) { e.quantity = +m[1]; e.unit = unitNorm(m[2]); }
  if ((m = n.match(/(?:سمك|سماكه|تخانه)\s*(?:ال)?(?:خرسانه|حيطه|بلاطه|جدار)?\s*(\d+(?:\.\d+)?)\s*(سم|مم|cm|mm|م|متر)?/))) { e.thickness_cm = m[2]==='مم'||m[2]==='mm' ? +m[1]/10 : (m[2]==='م'||m[2]==='متر') ? +m[1]*100 : +m[1]; }
  else if ((m = n.match(/(\d+(?:\.\d+)?)\s*(?:سم|cm)(?=\s|$)/))) e.thickness_cm = +m[1];
  for (const c of CITY_N){ if (n.includes(c.n)) { e.location = c.name; break; } }
  if (!e.location && (m = n.match(/(?:في موقع|بموقع|موقع|الموقع|مكان|في|فى)\s+([؀-ۿ]{3,}(?:\s[؀-ۿ]{2,})?)/))) { const w = m[1]; if (!/^(الفاتور|الحساب|عرض|السعر|الشرك|النظام|الموقع)/.test(w)) e.location_text = w; }
  if ((m = n.match(/(\d+)\s*(?:يوم|ايام)/))) e.days = +m[1];
  if (/اسبوع|week/.test(n)) e.period = 'week'; else if (/شهر|month/.test(n)) e.period = 'month';
  if (/كاش|نقدي|نقدا|cash/.test(n)) e.payment_method = 'نقدي'; else if (/تحويل|حواله|حولت|بنك|transfer|iban|ايبان/.test(n)) e.payment_method = 'تحويل بنكي'; else if (/شيك|cheque|check/.test(n)) e.payment_method = 'شيك';
  if ((m = n.match(/(?:رقم (?:مرجع|المرجع|التحويل|العمليه|الحواله)|مرجع|ref(?:erence)?)[:\s#]*([a-z0-9\-]{4,})/))) e.reference = m[1].toUpperCase();
  if ((m = raw.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).match(/(?:\+?966|0)?(5\d{8})\b/))) e.phone = '+966' + m[1];
  const prod = matchProduct(n); if (prod) e.service = prod.id;
  const cust = findCustomerInText(n); if (cust) e.customer_id = cust.id;
  if ((m = n.match(/(?:شركه|مؤسسه)\s+([؀-ۿ]+(?:\s[؀-ۿ]+){0,3}?)(?=\s+(?:اسم|المسؤول|تليفون|رقم|جوال|موبايل|\+|0|5|عليه|عليها|رصيد|كام)|$)/))) e.company_text = (raw.match(/(شركة|مؤسسة|شركه|مؤسسه)\s+[؀-ۿ]+(?:\s[؀-ۿ]+){0,3}/)||[m[0]])[0];
  if ((m = raw.match(/(?:اسمه|اسمها|اسم المسؤول|المسؤول|الاسم|اسم)\s*:?\s*([؀-ۿ]+(?:\s[؀-ۿ]+)?)/))) e.person_name = m[1];
  const nums = (n.match(/\b\d+(?:\.\d+)?\b/g)||[]).map(Number); if (nums.length) e.numbers = nums;
  return e;
}

/* ---------- C. rule-based NLU (offline fallback) ---------- */
function ruleNLU(raw, ctx){
  const n = norm(raw);

  const R = (intent, conf, why) => ({ intent, confidence:conf, entities:e, engine:'rules', why });
  const words = n.split(' ').length;
  if (/^(الغي|الغاء|كنسل|cancel|خلاص مش عايز|مش عايز|بطل|وقف)/.test(n)) return R('CANCEL',.95,'cancel word');
  if (/^(ايوه|ايوا|اه|اها|نعم|تمام|موافق|اوك|اوكي|ok|okay|yes|اكيد|ماشي|صح|تاكيد|اعتمد|كده تمام|تمام كده|y)(?=\s|$)/.test(n) && words<=3) return R('CONFIRM',.95,'confirm word');
  if (/^(لا|لأ|لاء|no|مش صح|غلط|مش كده|لا غلط)(?=\s|$)/.test(n) && words<=3) return R('DENY',.95,'deny word');
  if (ctx && ctx.flow){
    // inside a flow: a bare answer is a FLOW_ANSWER unless it clearly starts a new request
    const newReq = /(عليا كام|رصيد|اخر فاتوره|كشف حساب|عرض سعر|تقرير|مين عليه)/.test(n);
    if (!newReq) return R('FLOW_ANSWER',.85,'active flow');
  }
  if (/^(سلام|السلام عليكم|اهلا|اهلين|هاي|هلا|مرحبا|صباح الخير|صباح النور|مساء الخير|مساء النور|hi|hello|hey|السلام|ازيك|ازيكم|كيفك|كيف الحال|عامل ايه)/.test(n) && words<=4) return R('GREETING',.95,'greeting');
  if (/^(شكرا|تسلم|مشكور|thanks|thank you|يعطيك العافيه|الله يعطيك العافيه)/.test(n) && words<=4) return R('THANKS',.95,'thanks');
  if (/(مساعده|help|تقدر تعمل ايه|ايه اللي تقدر|الاوامر|ممكن اعمل ايه|بتعمل ايه|ازاي استخدم|ايه الخدمات اللي)/.test(n)) return R('HELP',.9,'help');
  if (/(مين عليه|مين عليهم|مين اللي عليه|العملاء اللي عليهم|المتاخرين|متاخر في السداد|overdue|الديون|التحصيل|المديونيات|مستحقات متاخره|اكتر من \d+ يوم|فاتت الاستحقاق|عدت الاستحقاق|مين لسه ما دفعش|مين ما دفعش)/.test(n)) return R('WHO_OWES',.9,'who owes');
  if (/(اعمل متابعه|متابعه للعملاء|follow ?up|فكر العملاء|ذكر العملاء|ابعت تذكير|تابع العملاء|متابعه العروض|اللي ما ردوش|ما ردوش)/.test(n)) return R('FOLLOW_UP',.9,'follow up');
  if (/(تقرير المبيعات|تقرير الاسبوع|تقرير الشهر|sales report|ملخص المبيعات|المبيعات هذا الاسبوع|المبيعات الاسبوع|المبيعات الشهر|بعنا كام|جهزلي تقرير|تقرير مبيعات|ايه اخبار المبيعات)/.test(n)) return R('SALES_REPORT',.9,'sales report');
  if (/(عروض الاسعار المفتوحه|العروض المفتوحه|كل عروض الاسعار|العروض المعلقه|open quotations|العروض اللي لسه|عروض السعر اللي لسه|عروض الاسعار المعلقه|العروض اللي منتظره|هاتلي كل عروض)/.test(n)) return R('OPEN_QUOTATIONS',.9,'open quotes');
  if (e.quotation_no || /(فين عرض السعر|حاله عرض السعر|حاله العرض|عرض السعر بتاعي|عرضي وصل|العرض اتوافق|العرض اتقبل|عرض السعر اتقبل|اتبعت العرض|العرض اتبعت|رد علي العرض|العرض وصل|هتبعتوا العرض امتي|العرض هيتبعت امتي|فين العرض|صار علي عرض|صار علي العرض|وصلني عرض|العرض جاهز|عرض السعر جاهز)/.test(n)) return R('QUOTATION_STATUS',.85,'quotation status');
  if (/(ضيف عميل|اضف عميل|سجل عميل|add customer|new customer|انشئ عميل|ضيفلي عميل|سجلي عميل|اضيف عميل)/.test(n)) return R('CREATE_CUSTOMER',.9,'create customer');
  if (/(سجل ليد|\blead\b|عميل محتمل|ضيف ليد|فرصه جديده|سجل فرصه|عميل مهتم|سجله كفرصه)/.test(n)) return R('CREATE_LEAD',.85,'create lead');

  if (/(دور علي عميل|ابحث عن عميل|بيانات عميل|بيانات شركه|رقم عميل|تليفون عميل|search customer|عميل اسمه|فين عميل|هات بيانات|رقم شركه|تليفون شركه|بيانات ال)/.test(n)) return R('CUSTOMER_SEARCH',.85,'customer search');
  if (/(كشف حساب|كشف الحساب|statement|اعمل كشف|ابعت كشف|كشف حسابي|هات كشف)/.test(n)) return R('STATEMENT',.92,'statement');
  if (/(موعد استحقاق|موعد الاستحقاق|استحقاق|تاريخ الاستحقاق|due date|تستحق|يستحق|امتي الدفع|اخر ميعاد|اخر موعد|ميعاد الدفع|امتي اسدد|امتي السداد|متي اسدد|متي السداد)/.test(n)) return R('INVOICE_DUE_DATE',.88,'due date');
  if (/(اخر فاتوره|آخر فاتورة|last invoice|اخر فاتور|هات الفاتوره الاخيره|الفاتوره الاخيره|اخر فاتورتي)/.test(n)) return R('LAST_INVOICE',.92,'last invoice');
  if (e.invoice_no && !/((?<!ات)دفعت|حولت|سجل دفعه)/.test(n)) return R('INVOICE_STATUS',.88,'invoice number present');
  if (/(الفاتوره اتدفعت|اتدفعت|اتسددت|حاله الفاتوره|الفاتوره مدفوعه|status of invoice|invoice status|الفاتوره دي)/.test(n) && !/((?<!ات)دفعت|حولت)/.test(n)) return R('INVOICE_STATUS',.8,'invoice status words');
  if (/(فواتيري|الفواتير|كل الفواتير|هات الفواتير|فواتير مفتوحه|الفواتير المفتوحه|فواتير غير مدفوعه|invoices|عندي فواتير|ايه الفواتير|فواتير ال|فواتير)/.test(n)) return R('LIST_INVOICES',.85,'list invoices');
  const payVerb = /(سجل دفعه|سجلي دفعه|اضف دفعه|record payment|تم التحويل|حولت|حولتلكم|دفعتلكم|سددت|(?<!ات)دفعت|ادفع|عايز ادفع|هدفع|هحول)/.test(n);
  const paySearch = /(اخر دفعه|مدفوعات|دفعاتي|ايه اللي اتدفع|كام دفعت|دفعت كام|payments|اخر تحويل|التحويلات|كام اللي اتدفع|اللي اتدفع|دفعاتنا|هات المدفوعات|سجل الدفعات|الدفعات)/.test(n);
  if (payVerb && (e.amount || (e.numbers && e.numbers.some(x=>x>=50)) || /سجل|اضف|record|ادفع|عايز ادفع|هدفع|هحول/.test(n))) { if (!e.amount && e.numbers){ const cands = e.numbers.filter(x => x!==e.invoice_no && x>=50); if (cands.length) e.amount = Math.max(...cands); } return R('RECORD_PAYMENT',.88,'payment verb + amount'); }

  if (/(عليا كام|عليه كام|عليها كام|علي كام|كام عليا|كام عليه|رصيد|الرصيد|المتبقي|المستحق|باقي عليا|كم علي|كم المتبقي|balance|outstanding|اجمالي المستحق|حسابي كام|كام حسابي|عندكم كام|كام ليكم|ليكم كام|مديون بكام|عليا فلوس|عليه فلوس|عليها فلوس|كم باقي|فاضل عليا|فاضل كام|الباقي علي|كم المبلغ|المبلغ الباقي|كم عليه|كم عليها|عليا ايه|عليا اد ايه|ايه اللي عليا)/.test(n)) return R('CUSTOMER_BALANCE',.9,'balance words');

}

/* ---------- D. real AI (Claude via the artifact sample capability) ---------- */
const AI = { sample:null, status:'checking', lastError:null, calls:0, fails:0 };
(async function initAI(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function'){ AI.status='unavailable'; updateAIPill(); return; }
    const s = await window.claude.use('sample');
    if (!s){ AI.status='unavailable'; } else { AI.sample = s; AI.status='ready'; }
  } catch(e){ AI.status='unavailable'; }
  updateAIPill();
})();
function updateAIPill(){
  const p = $('#ai-pill'), t = $('#ai-pill-txt'); if (!p) return;
  const mode = S && S.settings ? S.settings.aiMode : 'auto';
  p.classList.remove('ok','warn','bad');
  if (mode==='rules'){ p.classList.add('warn'); t.textContent='المحرك: قواعد محاكاة (بدون AI)'; return; }
  if (AI.status==='ready'){ p.classList.add('ok'); t.textContent = 'المحرك: Claude AI حقيقي' + (mode==='auto' ? ' + قواعد احتياطية' : ''); }
  else if (AI.status==='denied'){ p.classList.add('bad'); t.textContent='الـAI مرفوض من المستخدم — شغال بالقواعد'; }
  else if (AI.status==='checking'){ t.textContent='جاري فحص محرك الـAI…'; }
  else { p.classList.add('warn'); t.textContent='الـAI غير متاح هنا — شغال بمحرك القواعد'; }
}

{"intent": "<INTENT>", "confidence": <0..1>, "entities": {"customer_name": string|null, "invoice_no": number|null, "quotation_no": number|null, "amount": number|null, "service": string|null (a product id like "P-04" when it matches the catalog, else the words used), "quantity": number|null, "unit": string|null, "location": string|null, "thickness_cm": number|null, "payment_method": "نقدي"|"تحويل بنكي"|"شيك"|null, "reference": string|null, "days": number|null, "period": "week"|"month"|null, "person_name": string|null, "company_text": string|null, "phone": string|null, "invoice_filter": "open"|"all"|null}, "flow_answer": {"<slot>": value} | null}

LAST USER MESSAGE: """${raw.slice(0,600)}"""`;
}
async function aiNLU(raw, actor, ctx, history){
  const prompt = buildAIPrompt(raw, actor, ctx, history);
  AI.calls++;
  const out = await AI.sample.json(prompt, { modelTier:'quick', cache:false });
  if (!out || typeof out !== 'object' || !out.intent) throw { code:'invalid_json', message:'no intent' };
  const intent = INTENTS[out.intent] ? out.intent : 'UNKNOWN';
  const ents = Object.assign({}, extractEntities(raw)); // rules extraction as a base, AI overrides
  const ai = out.entities || {};
  for (const [k,v] of Object.entries(ai)){ if (v !== null && v !== undefined && v !== '') ents[k] = v; }
  if (ai.service){ const p = matchProduct(String(ai.service)); if (p) ents.service = p.id; }
  if (ai.customer_name && !ents.customer_id){ const c = findCustomerInText(norm(ai.customer_name)); if (c) ents.customer_id = c.id; else ents.customer_name = ai.customer_name; }
  if (ai.unit) ents.unit = unitNorm(ai.unit) || ai.unit;
  if (ai.phone){ const m = String(ai.phone).match(/(5\d{8})\D*$/); if (m) ents.phone = '+966'+m[1]; }
  return { intent, confidence: clamp(+out.confidence || .7, 0, 1), entities: ents, engine:'ai', flow_answer: out.flow_answer || null, rawAI: out };
}
async function classify(raw, actor, ctx, history){
  const eng = engineToUse();
  if (eng === 'ai'){
    try { const r = await aiNLU(raw, actor, ctx, history); return r; }
    catch(e){
      AI.fails++; AI.lastError = e && e.code ? e.code : String(e);
      if (e && (e.code==='not_granted' || e.code==='sampling_disabled' || e.code==='not_declared')){ AI.status = e.code==='not_granted' ? 'denied' : 'unavailable'; updateAIPill(); }
      const r = ruleNLU(raw, ctx); r.engine = 'rules'; r.fallbackFrom = 'ai:' + (e && e.code ? e.code : 'error'); return r;
    }
  }
  return ruleNLU(raw, ctx);
}

/* ---------- E. flows (multi-turn slot filling) ---------- */
const FLOWS = {
  CREATE_QUOTATION:{ title:'طلب عرض سعر', slots:(actor)=> STAFF(actor.role) ? ['customer','service','quantity','location','thickness'] : actor.role==='unknown' ? ['person_name','company_text','service','quantity','location','thickness'] : ['service','quantity','location','thickness'] },
  RECORD_PAYMENT:{ title:'تسجيل دفعة', slots:(actor)=> STAFF(actor.role) ? ['customer','amount','payment_method','invoice_no'] : ['amount','payment_method','invoice_no'] },
  CREATE_INVOICE:{ title:'إنشاء فاتورة', slots:()=>['customer','amount','description'] },
  CREATE_CUSTOMER:{ title:'إضافة عميل', slots:()=>['company_text','person_name','phone'] },
  CREATE_LEAD:{ title:'تسجيل فرصة', slots:()=>['person_name','phone','service','location'] },
  NEED_CUSTOMER:{ title:'تحديد العميل', slots:()=>['customer'] },
  NEED_INVOICE:{ title:'تحديد الفاتورة', slots:()=>['invoice_no'] },
};
const SLOT_Q = {
  customer:'العميل مين؟ اكتب اسم الشركة أو اسم المسؤول.',
  service:'الخدمة المطلوبة إيه؟ (قص خرسانة / كور / مسح GPR / هدم / حقن شروخ / تقوية كربون / زرع أشاير / معالجة صدأ)',
  quantity:'الكمية التقريبية كام؟ (مثال: 20 متر، 50 نقطة، 300 م²)',
  location:'موقع العمل فين؟ (المدينة أو اسم المشروع)',
  thickness:'سمك الخرسانة كام سم؟ (لو مش متأكد اكتب "مش عارف")',
  amount:'المبلغ كام؟',
  payment_method:'طريقة الدفع؟ (تحويل بنكي / شيك / نقدي)',
  invoice_no:'رقم الفاتورة؟ (أو اكتب "أقدم فاتورة" عشان نخصمها من أقدم فاتورة مفتوحة)',
  description:'وصف الفاتورة / الأعمال؟',
  company_text:'اسم الشركة؟',
  person_name:'اسم المسؤول؟',
  phone:'رقم الجوال؟ (05xxxxxxxx)',
};
const SLOT_OPTIONAL = { thickness:true, invoice_no:true, company_text:true, location:false };
function slotLabel(s){ return {customer:'العميل',service:'الخدمة',quantity:'الكمية',location:'الموقع',thickness:'السمك',amount:'المبلغ',payment_method:'طريقة الدفع',invoice_no:'الفاتورة',description:'الوصف',company_text:'الشركة',person_name:'المسؤول',phone:'الجوال'}[s]||s; }
function fmtSlot(s, v){
  if (v===null||v===undefined||v==='') return '—';
  if (s==='customer') return customerName(v);
  if (s==='service') { const p = productById(v); return p ? p.name : v; }
  if (s==='quantity') return fmtN(v);
  if (s==='thickness') return v==='unknown' ? 'غير محدد' : v+' سم';
  if (s==='amount') return fmtMoney(v);
  if (s==='invoice_no') return v==='oldest' ? 'أقدم فاتورة مفتوحة' : 'INV-'+v;
  return String(v);
}
/* pull slot values out of extracted entities (+ optional AI flow_answer) */
function fillSlots(ctx, raw, nlu, actor){
  const e = nlu.entities || {}; const fa = nlu.flow_answer || {}; const n = norm(raw);
  const set = (k,v) => { if (v!==undefined && v!==null && v!=='') ctx.slots[k] = v; };
  // from AI flow answer first
  for (const [k,v] of Object.entries(fa)){
    if (!ctx.all.includes(k)) continue;
    if (k==='customer'){ const c = findCustomerInText(norm(String(v))); if (c) set('customer', c.id); }
    else if (k==='service'){ const p = matchProduct(String(v)); if (p) set('service', p.id); }
    else if (k==='thickness'){ set('thickness', /مش عارف|غير معروف|unknown|لا اعرف|مش متاكد/.test(norm(String(v))) ? 'unknown' : parseFloat(v)||undefined); }
    else if (k==='invoice_no'){ set('invoice_no', /اقدم|oldest|اي فاتوره/.test(norm(String(v))) ? 'oldest' : parseInt(v)||undefined); }
    else if (k==='quantity'||k==='amount'){ set(k, parseFloat(v)||undefined); }
    else set(k, String(v));
  }
  // from generic entities
  if (e.customer_id) set('customer', e.customer_id);
  if (e.service) set('service', e.service);
  if (e.quantity) set('quantity', e.quantity);
  if (e.unit) ctx.unit = e.unit;
  if (e.location) set('location', e.location); else if (e.location_text) set('location', e.location_text);
  if (e.thickness_cm) set('thickness', e.thickness_cm);
  if (e.amount) set('amount', e.amount);
  else if (ctx.all.includes('amount') && ctx.slots.amount===undefined && e.numbers){ const cands = e.numbers.filter(x => x!==e.invoice_no && x!==e.quotation_no && x!==e.quantity && x!==e.thickness_cm && x>=50); if (cands.length) set('amount', Math.max(...cands)); }
  if (e.payment_method) set('payment_method', e.payment_method);
  if (e.invoice_no) set('invoice_no', e.invoice_no);
  if (e.reference) ctx.reference = e.reference;
  if (e.phone) set('phone', e.phone);
  if (e.person_name) set('person_name', e.person_name);
  if (e.company_text) set('company_text', e.company_text);
  // the message may be a bare answer to the slot we asked about
  const asked = ctx.asked;
  if (asked && ctx.slots[asked]===undefined){
    const num = (n.match(/\d+(?:\.\d+)?/)||[])[0];
    if (asked==='quantity' && num) set('quantity', +num);
    else if (asked==='amount' && num) set('amount', +num);
    else if (asked==='thickness'){ if (/مش عارف|معرفش|غير معروف|unknown|لا اعرف|مش متاكد|مش محدد/.test(n)) set('thickness','unknown'); else if (num) set('thickness', +num); }
    else if (asked==='invoice_no'){ if (/اقدم|oldest|اي فاتوره|اي واحده/.test(n)) set('invoice_no','oldest'); else if (num && +num>=100) set('invoice_no', +num); }
    else if (asked==='location' && raw.trim().length>=2 && !num) set('location', raw.trim());
    else if (asked==='description' && raw.trim().length>=2) set('description', raw.trim());
    else if (asked==='person_name' && raw.trim().length>=2 && !num) set('person_name', raw.trim());
    else if (asked==='company_text' && raw.trim().length>=2){ if (/^(لا|مفيش|بدون|فرد|شخصي|no)/.test(n)) set('company_text','—'); else set('company_text', raw.trim()); }
    else if (asked==='customer'){ const c = findCustomerInText(n); if (c) set('customer', c.id); }
    else if (asked==='service'){ const p = matchProduct(n); if (p) set('service', p.id); }
    else if (asked==='payment_method'){ if (e.payment_method) set('payment_method', e.payment_method); }
    else if (asked==='phone' && e.phone) set('phone', e.phone);
  }
  // thickness only matters for cutting / coring / demolition
  if (ctx.slots.service){ const p = productById(ctx.slots.service); if (p && !['قص','كور','هدم'].includes(p.cat) && ctx.slots.thickness===undefined) ctx.slots.thickness = 'n/a'; }
  ctx.missing = ctx.all.filter(k => ctx.slots[k]===undefined);
}
function startFlow(flowName, actor, seedNLU, raw){
  const f = FLOWS[flowName]; const all = f.slots(actor);
  const ctx = { flow:flowName, all, slots:{}, missing:all.slice(), asked:null, confirming:false, startedAt:new Date().toISOString(), intent: flowName };
  if (seedNLU) fillSlots(ctx, raw||'', seedNLU, actor);
  return ctx;
}
function nextQuestion(ctx){
  const k = ctx.missing[0]; ctx.asked = k;
  const q = SLOT_Q[k] || ('محتاج '+slotLabel(k)+'؟');
  const done = ctx.all.filter(s => ctx.slots[s]!==undefined && ctx.slots[s]!=='n/a').map(s => `• ${slotLabel(s)}: ${fmtSlot(s, ctx.slots[s])}`).join('\n');
  return (done ? 'تمام، سجلت:\n'+done+'\n\n' : '') + q;
}
function confirmSummary(ctx){
  const lines = ctx.all.filter(s => ctx.slots[s]!=='n/a').map(s => `• ${slotLabel(s)}: ${fmtSlot(s, ctx.slots[s])}${s==='quantity'&&ctx.unit?' '+ctx.unit:''}`).join('\n');
  return `*ملخص ${FLOWS[ctx.flow].title}:*\n${lines}\n\nأأكد الطلب؟`;
}

  let q = null;
  if (e.quotation_no) q = S.quotations.find(x=>x.id==='QT-'+e.quotation_no);
  else if (a.role==='customer') q = S.quotations.filter(x=>x.customerId===a.customer.id).sort((x,y)=> x.date<y.date?1:-1)[0];
  else if (e.customer_id) q = S.quotations.filter(x=>x.customerId===e.customer_id).sort((x,y)=> x.date<y.date?1:-1)[0];
  if (!q) return { reply: e.quotation_no ? `مش لاقي عرض سعر برقم ${e.quotation_no}.` : 'مش لاقي عروض أسعار على حسابك. تحب تطلب عرض سعر جديد؟' };
  if (a.role==='customer' && q.customerId!==a.customer.id) return { reply:`عرض السعر ${q.id} مش مسجل على حسابك 🔒`, denied:true };
  const stMsg = { draft:'لسه بيتجهز', pending_approval:'بانتظار اعتماد التسعير — هيوصلك خلال وقت قصير', sent:'مرسل ومنتظرين ردكم', accepted:'مقبول ✅ وتم فتح أمر شغل', rejected:'مرفوض', expired:'انتهت صلاحيته — نقدر نجدده لو تحب' }[q.status];
  return { reply:`📝 *${q.id}* — ${customerName(q.customerId)}\n${q.items.map(x=>`${x.name}: ${fmtN(x.qty)} ${x.unit}`).join('\n')}\nالإجمالي: ${q.status==='pending_approval'||q.status==='draft'?'(بعد الاعتماد)':fmtMoney(q.total)}\nالحالة: *${STATUS_AR[q.status]}* — ${stMsg}\nصالح حتى ${fmtDateAr(q.validUntil)}`, data:{quotation:q.id, status:q.status} };
};
H.OPEN_QUOTATIONS = (a) => {
  const list = S.quotations.filter(q=>q.status==='sent'||q.status==='pending_approval').sort((x,y)=> x.date<y.date?1:-1);
  if (!list.length) return { reply:'مفيش عروض أسعار مفتوحة حالياً.' };

};
H.FOLLOW_UP = (a, e, ctx, trace) => {

  if (!stale.length) return { reply:'كل العروض المرسلة لسه جديدة (أقل من 7 أيام). مفيش حاجة تحتاج متابعة دلوقتي.' };
  const targets = stale.slice(0,8);

  audit(a.name, 'FOLLOW_UP', 'quotation', targets.map(q=>q.id).join(','), `إرسال ${targets.length} تذكير`);
  return { reply:`تم إرسال رسالة متابعة لـ *${targets.length}* عميل على عروض أسعار عدّى عليها أكتر من 7 أيام بدون رد:\n${targets.map(q=>`• ${q.id} — ${customerName(q.customerId)} — ${daysBetween(q.date,TODAY)} يوم`).join('\n')}${stale.length>8?`\n(باقي ${stale.length-8} عرض هيتبعتوا في الدفعة الجاية)`:''}`, notify, data:{sent:targets.length} };
};
H.SALES_REPORT = (a, e) => {
  const period = e.period==='month' ? 30 : 7; const from = fmtDate(addDays(TODAY,-period));
  const q = S.quotations.filter(x=>x.date>=from), acc = q.filter(x=>x.status==='accepted');
  const leads = S.leads.filter(x=>x.date>=from), orders = S.orders.filter(x=>x.date>=from);

};
H.WHO_OWES = (a, e) => {
  const days = e.days || S.settings.overdueDays;
  const cut = fmtDate(addDays(TODAY,-days));
  const map = {};
  S.invoices.forEach(i => { if (i.remaining>0 && i.dueDate<=cut){ (map[i.customerId] = map[i.customerId]||{amt:0,n:0,oldest:i.dueDate}); map[i.customerId].amt += i.remaining; map[i.customerId].n++; if (i.dueDate<map[i.customerId].oldest) map[i.customerId].oldest=i.dueDate; } });
  const rows = Object.entries(map).map(([cid,v])=>({cid, ...v})).sort((x,y)=>y.amt-x.amt);
  if (!rows.length) return { reply:`مفيش عملاء متأخرين أكتر من ${days} يوم 🎉` };
  return { reply:`العملاء المتأخرين أكتر من *${days} يوم* (${rows.length} عميل):\n${rows.slice(0,10).map((r,i)=>`${i+1}. ${customerName(r.cid)} — *${fmtMoney(r.amt)}* — ${r.n} فاتورة — أقدم استحقاق ${fmtDateAr(r.oldest)}`).join('\n')}${rows.length>10?`\n… و${rows.length-10} عميل آخر`:''}\n\n*إجمالي المتأخر: ${fmtMoney(sum(rows,r=>r.amt))}*`, attach:{name:`Overdue_${days}d.xlsx`, kind:'تقرير Excel'}, data:{customers:rows.length, total:sum(rows,r=>r.amt)} };
};
H.CUSTOMER_SEARCH = (a, e) => {

  const b = customerBalance(c.id); const rep = byId(S.users,c.salesRep);

  if (a.role!=='sales') t += `\nالرصيد المستحق: ${fmtMoney(b.remaining)} (${b.count} فاتورة)`; else t += `\nالرصيد المستحق: ${fmtMoney(b.remaining)}`;

/* execute a completed flow (after confirmation) */
function executeFlow(ctx, a, trace){
  const s = ctx.slots; const needsApproval = t => !!S.settings.approvals[t];
  if (ctx.flow==='CREATE_QUOTATION'){
    let customer = s.customer ? byId(S.customers, s.customer) : a.customer;
    let leadId = null;
    if (!customer){ // unknown number → lead
      const p = productById(s.service);
      const lead = { id:'LD-'+(S.counters.ld++), name:s.person_name||'—', phone:a.phone, company:s.company_text==='—'?'':(s.company_text||''), service:s.service, serviceName:p.name, location:s.location||'', qty:s.quantity, unit:ctx.unit||p.unit, thickness:s.thickness&&s.thickness!=='unknown'&&s.thickness!=='n/a'?s.thickness+' سم':'', date:fmtDate(TODAY), status:'new', source:'whatsapp', assignedTo:'U-S1', createdAt:new Date().toISOString() };
      S.leads.unshift(lead); leadId = lead.id; audit('bot','CREATE_LEAD','lead',lead.id,`من رقم ${a.phone}`);
    }
    const p = productById(s.service); const qty = s.quantity; const items=[{productId:p.id, name:p.name, unit:p.unit, qty, price:p.price, total:qty*p.price}];
    const subtotal = sum(items,x=>x.total), vat = Math.round(subtotal*0.15);
    const q = { id:'QT-'+(S.counters.qt++), customerId: customer?customer.id:null, leadId, contactPhone:a.phone, date:fmtDate(TODAY), validUntil:fmtDate(addDays(TODAY,15)), items, subtotal, vat, total:subtotal+vat, status: needsApproval('SEND_QUOTATION')?'pending_approval':'sent', location:s.location||'', thickness:s.thickness, notes:`طلب عبر واتساب من ${a.name}`, requestedVia:'whatsapp', salesRep: customer?customer.salesRep:'U-S1', followUps:0, createdAt:new Date().toISOString() };
    S.quotations.unshift(q); audit(a.name,'CREATE_QUOTATION','quotation',q.id,`${p.name} × ${qty} — ${fmtMoney(q.total)} (تسعير تلقائي من قائمة الأسعار)`);
    const rep = byId(S.users, q.salesRep); const notify = [];
    if (rep) notify.push({ phone:rep.phone, text:`🔔 طلب تسعير جديد *${q.id}*\nمن: ${customer?customer.company:(s.person_name||'')+' (عميل جديد — '+leadId+')'}\n${p.name}: ${fmtN(qty)} ${p.unit}${s.location?' — '+s.location:''}${s.thickness&&s.thickness!=='unknown'&&s.thickness!=='n/a'?' — سمك '+s.thickness+' سم':''}\nالتسعير المبدئي: ${fmtMoney(q.total)}`, label:`إشعار مبيعات → ${rep.name}` });
    if (q.status==='pending_approval'){
      const ap = createApproval('SEND_QUOTATION', {quotationId:q.id, customer: customer?customer.company:(s.person_name||'عميل جديد'), total:q.total, summary:`${p.name} × ${fmtN(qty)} ${p.unit}`}, a, 'admin');
      const adm = S.users.find(u=>u.role==='admin'); if (adm) notify.push({ phone:adm.phone, text:`🔔 عرض سعر *${q.id}* بانتظار اعتمادك (${ap.id})\n${customer?customer.company:s.person_name||''} — ${p.name} × ${fmtN(qty)} — ${fmtMoney(q.total)}`, label:`طلب اعتماد → ${adm.name}` });
      return { reply:`تم تسجيل طلبك ✅\nرقم الطلب: *${q.id}*\n${p.name}: ${fmtN(qty)} ${p.unit}${s.location?'\nالموقع: '+s.location:''}\n\nعرض السعر بيتراجع من قسم التسعير وهيوصلك هنا على واتساب بمجرد اعتماده 📎`, notify, data:{quotation:q.id, approval:ap.id, lead:leadId} };
    }
    return { reply:quotationMessage(q), attach:{name:q.id+'.pdf', kind:'عرض سعر PDF'}, notify, data:{quotation:q.id, lead:leadId} };
  }
  if (ctx.flow==='RECORD_PAYMENT'){
    const customer = s.customer ? byId(S.customers, s.customer) : a.customer;
    let inv = null;
    if (s.invoice_no && s.invoice_no!=='oldest') inv = S.invoices.find(i=>i.id==='INV-'+s.invoice_no);
    if (!inv) inv = customerInvoices(customer.id).filter(i=>i.remaining>0).sort((x,y)=> x.dueDate<y.dueDate?-1:1)[0] || null;
    if (inv && inv.customerId!==customer.id){ delete ctx.slots.invoice_no; ctx.confirming=false; ctx.missing=['invoice_no']; ctx.asked='invoice_no'; return { reply:`الفاتورة ${inv.id} مش على حساب ${customer.company} 🔒\nابعت رقم فاتورة صحيح، أو اكتب "أقدم فاتورة".`, reopen:true }; }
    const payload = { customerId:customer.id, customer:customer.company, amount:s.amount, method:s.payment_method, invoiceId: inv?inv.id:null, reference: ctx.reference||'', reportedBy:a.name };
    if (needsApproval('RECORD_PAYMENT')){
      const ap = createApproval('RECORD_PAYMENT', payload, a, a.role==='accountant'?'admin':'accountant');
      const acc = S.users.find(u=>u.role===(a.role==='accountant'?'admin':'accountant'));
      const notify = acc ? [{ phone:acc.phone, text:`🔔 طلب تسجيل دفعة *${ap.id}*\n${customer.company}: ${fmtMoney(s.amount)} — ${s.payment_method}${inv?' — '+inv.id:''}\nمن: ${a.name}`, label:`طلب اعتماد → ${acc.name}` }] : [];
      return { reply:`تم استلام بيانات الدفعة ✅\nالعميل: ${customer.company}\nالمبلغ: ${fmtMoney(s.amount)} — ${s.payment_method}${inv?'\nالفاتورة: '+inv.id:''}\n\nالدفعة *بانتظار مراجعة المحاسب* (${ap.id}) وهنبلغك بمجرد ترحيلها.`, notify, data:{approval:ap.id} };
    }
    const pay = applyPayment(payload, a.name);
    return { reply:`تم ترحيل الدفعة ✅ *${pay.id}*\n${fmtMoney(pay.amount)} — ${pay.method} — على ${pay.invoiceId}`, data:{payment:pay.id} };
  }
  if (ctx.flow==='CREATE_INVOICE'){
    const customer = byId(S.customers, s.customer);
    const payload = { customerId:customer.id, customer:customer.company, amount:s.amount, description:s.description, requestedBy:a.name };
    if (needsApproval('CREATE_INVOICE') || s.amount >= S.settings.approvalThreshold){
      const ap = createApproval('CREATE_INVOICE', payload, a, a.role==='accountant'?'admin':'accountant');
      const acc = S.users.find(u=>u.role===(a.role==='accountant'?'admin':'accountant'));
      const notify = acc ? [{ phone:acc.phone, text:`🔔 مسودة فاتورة *${ap.id}* تحتاج اعتمادك\n${customer.company} — ${fmtMoney(s.amount)}\n${s.description}\nمن: ${a.name}`, label:`طلب اعتماد → ${acc.name}` }] : [];
      return { reply:`تم إنشاء *مسودة فاتورة* لـ ${customer.company} بقيمة ${fmtMoney(s.amount)} (${ap.id}).\nالفاتورة مش هتصدر غير بعد اعتماد ${a.role==='accountant'?'المدير':'المحاسب'} ✋`, notify, data:{approval:ap.id} };
    }
    const inv = applyInvoice(payload, a.name);
    return { reply:`تم إصدار الفاتورة ✅ *${inv.id}* لـ ${customer.company} بقيمة ${fmtMoney(inv.amount)}`, data:{invoice:inv.id} };
  }
  if (ctx.flow==='CREATE_CUSTOMER'){
    const payload = { company:s.company_text, name:s.person_name, phone:s.phone, salesRep: a.role==='sales'?a.id:'U-S1', requestedBy:a.name };
    if (needsApproval('CREATE_CUSTOMER')){
      const ap = createApproval('CREATE_CUSTOMER', payload, a, 'admin');
      return { reply:`تم تسجيل طلب إضافة العميل *${s.company_text}* (${ap.id}) وبانتظار اعتماد المدير.`, data:{approval:ap.id} };
    }
    const c = applyCustomer(payload, a.name);
    return { reply:`تم إضافة العميل ✅\n*${c.company}* — ${c.id}\nالمسؤول: ${c.name} — ${c.phone}\nدلوقتي الرقم ده يقدر يستخدم المساعد كعميل.`, data:{customer:c.id} };
  }
  if (ctx.flow==='CREATE_LEAD'){
    const p = productById(s.service);
    const lead = { id:'LD-'+(S.counters.ld++), name:s.person_name, phone:s.phone, company:'', service:p.id, serviceName:p.name, location:s.location||'', qty:null, unit:p.unit, thickness:'', date:fmtDate(TODAY), status:'new', source:'whatsapp', assignedTo: a.role==='sales'?a.id:'U-S1', createdAt:new Date().toISOString() };
    S.leads.unshift(lead); audit(a.name,'CREATE_LEAD','lead',lead.id,`${lead.name} — ${p.name}`);
    return { reply:`تم تسجيل الفرصة ✅ *${lead.id}*\n${lead.name} — ${lead.phone}\n${p.name} — ${lead.location}`, data:{lead:lead.id} };
  }
  return { reply:'تم.' };
}
function quotationMessage(q){
  return `📝 *عرض سعر ${q.id}*\n${S.settings.companyName}\nإلى: ${q.customerId?customerName(q.customerId):'—'}\n\n${q.items.map(x=>`${x.name}\n${fmtN(x.qty)} ${x.unit} × ${fmtN(x.price)} = ${fmtN(x.total)}`).join('\n')}\n\nالإجمالي: ${fmtN(q.subtotal)}\nضريبة القيمة المضافة 15%: ${fmtN(q.vat)}\n*الصافي: ${fmtMoney(q.total)}*\nصالح حتى ${fmtDateAr(q.validUntil)}\n\nللموافقة اكتب "موافق على ${q.id}" أو تواصل مع مندوبك.`;
}

/* ---------- G. approvals, notifications, apply actions ---------- */
function createApproval(type, payload, actor, approverRole){
  const ap = { id:'AP-'+(S.counters.ap++), type, payload, requestedBy:actor.name, requestedByPhone:actor.phone, requesterRole:actor.role, approverRole, requestedAt:new Date().toISOString(), status:'pending', decidedBy:null, decidedAt:null, note:'' };
  S.approvals.unshift(ap); audit(actor.name, 'REQUEST_'+type, 'approval', ap.id, JSON.stringify(payload).slice(0,160)); save(); return ap;
}
function applyPayment(p, by){
  const pay = { id:'PAY-'+(S.counters.pay++), customerId:p.customerId, invoiceId:p.invoiceId, date:fmtDate(TODAY), amount:p.amount, method:p.method, reference:p.reference||('WA'+Date.now().toString().slice(-6)), recordedBy:by };
  S.payments.unshift(pay);
  if (p.invoiceId){ const inv = byId(S.invoices,p.invoiceId); if (inv){ const applied = Math.min(inv.remaining, p.amount); inv.paid += applied; inv.remaining -= applied; } }
  audit(by,'RECORD_PAYMENT','payment',pay.id,`${fmtMoney(pay.amount)} — ${pay.method} — ${pay.invoiceId||'بدون فاتورة'}`); save(); return pay;
}
function applyInvoice(p, by){
  const subtotal = Math.round(p.amount/1.15), vat = p.amount - subtotal;
  const inv = { id:'INV-'+(S.counters.inv++), customerId:p.customerId, date:fmtDate(TODAY), dueDate:fmtDate(addDays(TODAY,30)), project:p.description||'', items:[{productId:'', name:p.description||'أعمال', unit:'مقطوعية', qty:1, price:subtotal, total:subtotal}], subtotal, vat, amount:p.amount, paid:0, remaining:p.amount, status:'unpaid', createdBy:by };
  S.invoices.unshift(inv); audit(by,'CREATE_INVOICE','invoice',inv.id,`${customerName(inv.customerId)} — ${fmtMoney(inv.amount)}`); save(); return inv;
}
function applyCustomer(p, by){
  const c = { id:'C-'+String(S.counters.cust++).padStart(3,'0'), company:p.company, core:p.company.replace(/^(شركة|مؤسسة|شركه|مؤسسه)\s+/,'').split(' ').slice(0,2).join(' '), name:p.name, phone:p.phone, vat:'', city:'', creditLimit:50000, status:'active', salesRep:p.salesRep||'U-S1', createdAt:fmtDate(TODAY) };
  S.customers.push(c); audit(by,'CREATE_CUSTOMER','customer',c.id,c.company); save(); return c;
}
function decideApproval(id, approve, by, note){
  const ap = byId(S.approvals, id); if (!ap || ap.status!=='pending') return null;
  ap.status = approve ? 'approved' : 'rejected'; ap.decidedBy = by; ap.decidedAt = new Date().toISOString(); ap.note = note||'';
  const p = ap.payload; const out = { notify:[] };
  if (approve){
    if (ap.type==='RECORD_PAYMENT'){ const pay = applyPayment(p, by); out.result = pay.id; const c = byId(S.customers,p.customerId); if (c) out.notify.push({phone:c.phone, text:`✅ تم ترحيل دفعتك *${pay.id}*\n${fmtMoney(pay.amount)} — ${pay.method}${pay.invoiceId?' — على الفاتورة '+pay.invoiceId:''}\nشكراً لسدادكم 🙏`}); if (ap.requestedByPhone && (!c || c.phone!==ap.requestedByPhone)) out.notify.push({phone:ap.requestedByPhone, text:`✅ تم اعتماد طلبك ${ap.id} — الدفعة ${pay.id} اتسجلت.`}); }
    else if (ap.type==='CREATE_INVOICE'){ const inv = applyInvoice(p, by); out.result = inv.id; const c = byId(S.customers,p.customerId); if (c) out.notify.push({phone:c.phone, text:`📄 تم إصدار فاتورة جديدة *${inv.id}* على حسابكم بقيمة ${fmtMoney(inv.amount)}\n${inv.project}\nالاستحقاق: ${fmtDateAr(inv.dueDate)}`}); if (ap.requestedByPhone) out.notify.push({phone:ap.requestedByPhone, text:`✅ تم اعتماد الفاتورة ${inv.id} (${ap.id}) بواسطة ${by}.`}); }
    else if (ap.type==='CREATE_CUSTOMER'){ const c = applyCustomer(p, by); out.result = c.id; if (ap.requestedByPhone) out.notify.push({phone:ap.requestedByPhone, text:`✅ تم اعتماد إضافة العميل ${c.company} — ${c.id}`}); }

  } else {

  }

}

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function handleIncoming(phone, raw, opts={}){
  const t0 = performance.now(); const trace = { steps:[], notifications:[], phone, text:raw, startedAt:new Date().toISOString() };
  let last = t0;
  const step = (title, status, detail, extra) => { const now = performance.now(); trace.steps.push({ n:trace.steps.length+1, title, status, detail, extra, ms: Math.round(now-last) }); last = now; if (opts.onStep) opts.onStep(trace); };
  const c = conv(phone);
  const inMsg = pushMsg(phone, 'out', raw, {});
  step('استقبال الرسالة (Webhook)', 'ok', `رسالة نصية من ${phone} — ${raw.length} حرف`, { message_id:inMsg.id, channel:'whatsapp (simulated)' });

  const actor = resolveActor(phone);
  step('تحديد المرسل والدور', actor.role==='unknown'?'warn':'ok', actor.role==='unknown' ? 'الرقم غير مسجل كعميل ولا موظف' : `${actor.name} — ${ROLES[actor.role].label}${actor.customer?' — '+actor.customer.company:''}`, { role:actor.role, id:actor.id });

  const ctx = c.context;
  const nlu = await classify(raw, actor, ctx, c.messages.slice(-7,-1));
  nlu.entities._raw = raw;
  const engLabel = nlu.engine==='ai' ? 'Claude AI' : ('محرك القواعد' + (nlu.fallbackFrom ? ' (احتياطي بعد فشل '+nlu.fallbackFrom+')' : ''));
  step('فهم النية (AI Intent Detection)', nlu.intent==='UNKNOWN'?'warn':'ok', `${engLabel} → *${nlu.intent}* (${INTENTS[nlu.intent].ar}) — ثقة ${Math.round(nlu.confidence*100)}%`, { intent:nlu.intent, confidence:nlu.confidence, engine:nlu.engine, entities: stripRaw(nlu.entities), flow_answer:nlu.flow_answer||undefined, why:nlu.why, ai_raw: nlu.rawAI });

  let result = null; let intent = nlu.intent; let flowEnded = false; let handoff = null;
  // ---- flow handling ----
  if (ctx && ctx.flow && (intent==='FLOW_ANSWER' || intent==='CONFIRM' || intent==='DENY' || intent==='CANCEL' || (ctx.flow==='NEED_CUSTOMER'||ctx.flow==='NEED_INVOICE'))){
    if (intent==='CANCEL' || (intent==='DENY' && ctx.confirming)){
      c.context = null; result = { reply: intent==='CANCEL' ? 'تم إلغاء الطلب. لو احتجت حاجة تانية أنا موجود 🙂' : 'تمام، ألغيت الطلب. اكتب الطلب من جديد بالبيانات الصحيحة.' };
      step('إدارة المحادثة (Flow)', 'ok', `إلغاء ${FLOWS[ctx.flow].title}`);
    } else if (intent==='CONFIRM' && ctx.confirming){
      step('التحقق من الصلاحيات (RBAC)', 'ok', `${ROLES[actor.role].label} مسموح له بـ ${ctx.intent}`);
      result = executeFlow(ctx, actor, trace); if (!result.reopen){ c.context = null; flowEnded = true; }
      step('تنفيذ العملية (Business Logic)', 'ok', `executeFlow(${ctx.flow})`, result.data);
    } else {
      if (ctx.flow==='NEED_CUSTOMER' || ctx.flow==='NEED_INVOICE'){
        // resolve the missing thing then re-run the original intent
        fillSlots(ctx, raw, nlu, actor);
        if (ctx.missing.length){ result = { reply: ctx.flow==='NEED_CUSTOMER' ? 'مش لاقي عميل بالاسم ده. اكتب اسم الشركة زي ما هو مسجل (مثال: النخيل، الأفق).' : 'محتاج رقم الفاتورة (مثال: 1023).' }; step('إدارة المحادثة (Flow)', 'warn', 'لم يتم التعرف على القيمة المطلوبة'); }
        else { intent = ctx.intent; const ents = Object.assign({}, nlu.entities, ctx.entities||{}); if (ctx.slots.customer) ents.customer_id = ctx.slots.customer; if (ctx.slots.invoice_no) ents.invoice_no = ctx.slots.invoice_no; c.context = null; step('إدارة المحادثة (Flow)', 'ok', `تم تحديد ${slotLabel(ctx.all[0])} → إعادة تنفيذ ${intent}`); result = runIntent(intent, actor, ents, trace, raw, step); }
      } else {
        fillSlots(ctx, raw, nlu, actor);
        if (ctx.missing.length){ result = { reply: nextQuestion(ctx) }; step('إدارة المحادثة (Flow)', 'ok', `${FLOWS[ctx.flow].title}: باقي ${ctx.missing.map(slotLabel).join('، ')}`, { slots: ctx.slots }); }
        else { ctx.confirming = true; ctx.asked = null; result = { reply: confirmSummary(ctx), buttons:['تأكيد ✅','إلغاء ❌'] }; step('إدارة المحادثة (Flow)', 'ok', `${FLOWS[ctx.flow].title}: البيانات مكتملة — بانتظار التأكيد`, { slots: ctx.slots }); }
      }
    }
  } else {
    if (ctx && ctx.flow && !['GREETING','THANKS','HELP'].includes(intent)) { c.context = null; step('إدارة المحادثة (Flow)', 'warn', `طلب جديد أثناء ${FLOWS[ctx.flow].title} — تم إلغاء الـFlow السابق`); }
    if (intent==='CONFIRM' || intent==='DENY' || intent==='FLOW_ANSWER'){ intent = 'UNKNOWN'; nlu.confidence = .4; }
    if (intent==='CANCEL'){ result = { reply:'مفيش طلب شغال حالياً عشان ألغيه. اكتب طلبك وأنا جاهز 🙂' }; step('إدارة المحادثة (Flow)', 'ok', 'لا يوجد Flow نشط'); }
    else result = runIntent(intent, actor, nlu.entities, trace, raw, step);
  }
  // ---- handoff ----
  if (result.handoff){ handoff = createHandoff(phone, raw, result.handoff.reason, actor); const adm = S.users.find(u=>u.role==='admin'); if (adm) (result.notify = result.notify||[]).push({ phone:adm.phone, text:`🙋 تحويل بشري *${handoff.id}*\nمن: ${actor.name} (${ROLES[actor.role].label}) — ${phone}\nالرسالة: "${raw}"\nالسبب: ${result.handoff.reason}`, label:`تحويل بشري → ${adm.name}` }); step('تحويل لموظف (Human Handoff)', 'warn', `${handoff.id} — ${result.handoff.reason}`); }
  // ---- reply ----
  const replies = Array.isArray(result.reply) ? result.reply : [result.reply];
  step('صياغة الرد', 'ok', `${replies.length} رسالة${result.attach?' + مرفق '+result.attach.name:''}${result.buttons?' + أزرار تفاعلية':''}`);
  if (!opts.instant) { if (opts.onTyping) opts.onTyping(true); await sleep(S.settings.typingDelay); if (opts.onTyping) opts.onTyping(false); }
  const outMsgs = replies.map((r,i) => pushMsg(phone, 'in', r, { intent, attach: i===replies.length-1 ? result.attach||null : null, buttons: i===replies.length-1 ? result.buttons||null : null }));
  (result.notify||[]).forEach(nt => { sendNotification(nt, 'bot'); trace.notifications.push({ to:nt.phone, toName:(resolveActor(nt.phone).name), text:nt.text, label:nt.label||'إشعار' }); });
  const nOut = outMsgs.length + (result.notify||[]).length;
  const totalMs = Math.round(performance.now()-t0);
  step('إرسال الرد (WhatsApp API)', 'ok', `${nOut} رسالة صادرة — التكلفة التقديرية ${fmtN(nOut*S.settings.msgCost,2)} ريال — الزمن الكلي ${totalMs}ms`);
  const success = intent!=='UNKNOWN' && !result.denied;
  if (ctx && ctx.flow && ['FLOW_ANSWER','CONFIRM','DENY','CANCEL'].includes(intent)) intent = ctx.intent || intent;
  logRequest({ phone, role:actor.role, actor:actor.name, text:raw, intent, engine:nlu.engine, confidence:nlu.confidence, success, denied:!!result.denied, handoff:!!handoff, latency: totalMs, outMsgs:nOut, aiCall: nlu.engine==='ai', flowEnded });
  trace.totalMs = totalMs; trace.intent = intent; trace.result = result;
  save();
  return { trace, result, outMsgs };
}
function stripRaw(e){ const o = Object.assign({}, e); delete o._raw; delete o.numbers; return o; }
function runIntent(intent, actor, ents, trace, raw, step){
  // RBAC
  const allowed = (PERMS[actor.role]||[]).includes(intent);
  if (!allowed){
    step('التحقق من الصلاحيات (RBAC)', 'bad', `${ROLES[actor.role].label} غير مسموح له بـ ${intent}`);
    if (actor.role==='unknown') return { reply:`رقمك مش مسجل عندنا كعميل، فمش هقدر أعرض بيانات حسابات 🔒\n\n• لو أنت عميل حالي: ابعت اسم الشركة ورقم العميل وهيتم ربط رقمك من خلال الحسابات.\n• لو محتاج خدمة: اكتب "عايز عرض سعر" وأنا هساعدك.`, denied:true, handoff:{reason:'رقم غير مسجل يطلب بيانات'} };
    return { reply:`الطلب ده (${INTENTS[intent].ar}) خارج صلاحيات ${ROLES[actor.role].label} 🔒\nلو محتاجه اتواصل مع ${intent.includes('INVOICE')||intent.includes('PAYMENT')||intent==='STATEMENT'||intent==='WHO_OWES'?'المحاسب':'المدير'}.`, denied:true };
  }
  step('التحقق من الصلاحيات (RBAC)', 'ok', `${ROLES[actor.role].label} مسموح له بـ ${intent}${SENSITIVE.includes(intent)?' — عملية حساسة (تحتاج اعتماد)':''}`);
  const h = H[intent] || H.UNKNOWN;
  let res = h(actor, ents, null, trace, raw);
  if (res.askCustomer){ const cx = startFlow('NEED_CUSTOMER', actor); cx.intent = intent; cx.entities = ents; cx.asked='customer'; conv(actor.phone).context = cx; step('تنفيذ العملية (Business Logic)', 'warn', `${intent} يحتاج تحديد العميل`); return { reply: ents.customer_name ? `مش لاقي عميل باسم "${ents.customer_name}". اكتب اسم الشركة زي ما هو مسجل.` : SLOT_Q.customer }; }
  if (res.askInvoice){ const cx = startFlow('NEED_INVOICE', actor); cx.intent = intent; cx.entities = ents; cx.asked='invoice_no'; conv(actor.phone).context = cx; step('تنفيذ العملية (Business Logic)', 'warn', `${intent} يحتاج رقم الفاتورة`); return { reply:'رقم الفاتورة كام؟ (مثال: 1023)' }; }
  if (res.startFlow){
    const cx = startFlow(res.startFlow, actor, { entities: ents, flow_answer: null }, raw); conv(actor.phone).context = cx;
    if (cx.missing.length){ step('تنفيذ العملية (Business Logic)', 'ok', `بدء ${FLOWS[cx.flow].title} — مستخرج: ${Object.keys(cx.slots).filter(k=>cx.slots[k]!=='n/a').map(slotLabel).join('، ')||'لا شيء'} — ناقص: ${cx.missing.map(slotLabel).join('، ')}`, { slots:cx.slots }); return { reply: nextQuestion(cx) }; }
    cx.confirming = true; step('تنفيذ العملية (Business Logic)', 'ok', `بدء ${FLOWS[cx.flow].title} — كل البيانات موجودة في الرسالة — بانتظار التأكيد`, { slots:cx.slots }); return { reply: confirmSummary(cx), buttons:['تأكيد ✅','إلغاء ❌'] };
  }
  step('تنفيذ العملية + استعلام البيانات', res.denied?'warn':'ok', `${intent} → H.${intent}()${res.data?' — '+Object.entries(res.data).map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(', '):''}`, res.data);
  return res;
}

/* ================= CHARTS (inline SVG) ================= */
function barChart({labels, series, height=220, money=true, horizontal=false}){
  const W = 640, H = height, padL = horizontal ? 150 : 56, padR = 16, padT = 14, padB = horizontal ? 28 : 44;
  const maxV = Math.max(1, ...series.flatMap(s=>s.values));
  const nice = niceMax(maxV); const ticks = 4;
  let g = '';
  if (!horizontal){
    const iw = W-padL-padR, ih = H-padT-padB; const n = labels.length; const groupW = iw/n; const bw = Math.min(28, (groupW*0.7)/series.length);
    for (let t=0;t<=ticks;t++){ const v = nice*t/ticks; const y = padT + ih - ih*v/nice; g += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-6}" y="${y+4}" font-size="11" fill="var(--muted)" text-anchor="end">${money?fmtShort(v):fmtN(v)}</text>`; }
    labels.forEach((lb,i)=>{ const gx = padL + groupW*i + (groupW - bw*series.length - 2*(series.length-1))/2;
      series.forEach((s,j)=>{ const v = s.values[i]; const h = ih*v/nice; const x = gx + j*(bw+2); const y = padT+ih-h; g += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="3" fill="${s.color}"><title>${esc(lb)} — ${esc(s.name)}: ${money?fmtMoney(v):fmtN(v)}</title></rect>`; });
      g += `<text x="${padL + groupW*i + groupW/2}" y="${H-padB+16}" font-size="11" fill="var(--text-2)" text-anchor="middle">${esc(lb)}</text>`; });
    g += `<line x1="${padL}" x2="${W-padR}" y1="${padT+ih}" y2="${padT+ih}" stroke="var(--axis)"/>`;
  } else {
    const iw = W-padL-padR, ih = H-padT-padB; const n = labels.length; const rowH = ih/n; const bh = Math.min(18, rowH*0.6);
    for (let t=0;t<=ticks;t++){ const v = nice*t/ticks; const x = padL + iw*v/nice; g += `<line y1="${padT}" y2="${padT+ih}" x1="${x}" x2="${x}" stroke="var(--grid)"/><text x="${x}" y="${H-padB+16}" font-size="11" fill="var(--muted)" text-anchor="middle">${money?fmtShort(v):fmtN(v)}</text>`; }
    labels.forEach((lb,i)=>{ const v = series[0].values[i]; const w = iw*v/nice; const y = padT + rowH*i + (rowH-bh)/2; g += `<rect x="${padL}" y="${y}" width="${Math.max(w,0)}" height="${bh}" rx="3" fill="${series[0].color}"><title>${esc(lb)}: ${money?fmtMoney(v):fmtN(v)}</title></rect><text x="${padL-8}" y="${y+bh/2+4}" font-size="11.5" fill="var(--text-2)" text-anchor="end">${esc(lb)}</text><text x="${padL+Math.max(w,0)+6}" y="${y+bh/2+4}" font-size="11" fill="var(--text)" text-anchor="start">${money?fmtShort(v):fmtN(v)}</text>`; });
  }
  const legend = series.length>1 ? `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;direction:ltr" role="img">${g}</svg></div>${legend}`;
}
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v/p; const n = f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*p; }
function fmtShort(v){ return v>=1e6 ? (v/1e6).toFixed(1).replace(/\.0$/,'')+'M' : v>=1e3 ? (v/1e3).toFixed(v>=1e5?0:1).replace(/\.0$/,'')+'K' : fmtN(v); }

function stubActor(code){ const role = ROLE_CODE[code]; if (role==='customer') return { role, name:S.customers[0].name, id:S.customers[0].id, phone:S.customers[0].phone, customer:S.customers[0] }; if (role==='unknown') return { role, name:'رقم غير معروف', id:null, phone:'+966512345678' }; const u = S.users.find(x=>x.role===role); return { role, name:u.name, id:u.id, phone:u.phone, user:u }; }

async function runTests(engine, limit){
  const T = UI.tests; T.running = true; T.stop = false; T.progress = 0;
  const list = limit ? SCENARIOS.slice(0, limit) : SCENARIOS; const rows = [];
  for (let i=0;i<list.length;i++){
    if (T.stop) break;
    const [code, text, expected] = list[i]; const actor = stubActor(code);
    let got='', conf=0, eng=engine, err='';
    try {
      if (engine==='ai'){ if (!AI.sample) throw {code:'unavailable'}; const r = await aiNLU(text, actor, null, []); got = r.intent; conf = r.confidence; }
      else { const r = ruleNLU(text, null); got = r.intent; conf = r.confidence; }
    } catch(e){ err = (e && e.code) || 'error'; got = 'ERROR'; if (err==='not_granted'||err==='sampling_disabled'||err==='unavailable'){ toast('الـAI غير متاح — الاختبار اتوقف'); T.stop = true; } }
    rows.push({ i:i+1, role:ROLE_CODE[code], text, expected, got, ok: got===expected, conf, err });
    T.progress = Math.round((i+1)/list.length*100);
    const p = $('#test-prog i'); if (p) p.style.width = T.progress+'%'; const pt = $('#test-prog-txt'); if (pt) pt.textContent = `${i+1} / ${list.length} — نجاح ${rows.filter(r=>r.ok).length}`;
    if (engine==='ai') await sleep(250);
  }
  T.running = false;
  S.testResults = { engine, at:new Date().toISOString(), total:rows.length, passed:rows.filter(r=>r.ok).length, rows }; save();
  render();
}
