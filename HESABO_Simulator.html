  <p>المسار اللي بيحصل مع كل رسالة هو نفسه اللي هيحصل في الإنتاج:</p>
  <div class="flow"><span>WhatsApp</span><em>→</em><span>تحديد المرسل</span><em>→</em><span>AI Intent</span><em>→</em><span>RBAC</span><em>→</em><span>Business Logic</span><em>→</em><span>Accounting DB</span><em>→</em><span>Approval؟</span><em>→</em><span>Reply</span></div>
  <p>الـAI هنا مسؤول عن حاجة واحدة بس: <b>يفهم النية ويطلّع البيانات من الرسالة</b>. الأرقام كلها بتيجي من قاعدة البيانات بالكود، والعمليات الحساسة (فاتورة / دفعة / عرض سعر) بتتعمل كمسودة وتستنى اعتماد بشري. ودي أهم قاعدة في الـBrief (قسم 3 و 12 و 32).</p>
  <h3>محرك الـAI</h3>
  <p>لو الشريط فوق أخضر، فالسيمولاتور بيستخدم <b>Claude فعلياً</b> لفهم كل رسالة (أول رسالة هتطلب منك موافقة مرة واحدة). ولو الـAI مش متاح أو اخترت "قواعد فقط"، بيشتغل محرك قواعد بيفهم الأنماط الشائعة بالعامية — نفس الفكرة بس بمرونة أقل. تقدر تبدّل بينهم من فوق شاشة المسار وتقارن الفرق.</p>
  <h3>الأدوار والصلاحيات</h3>
  <div class="table-wrap"><table><thead><tr><th>الدور</th><th>يقدر يعمل</th><th>ممنوع منه</th></tr></thead><tbody>
    <tr><td><b>عميل</b></td><td>رصيده، فواتيره، مدفوعاته، كشف حسابه، الإبلاغ عن دفعة (بموافقة)، طلب عرض سعر ومتابعته</td><td>أي بيانات لعميل تاني، تقارير الشركة</td></tr>
    <tr><td><b>مبيعات</b></td><td>بيانات العملاء ورصيدهم الإجمالي، إضافة عميل، Leads، عروض الأسعار ومتابعتها، تقرير المبيعات</td><td>تفاصيل الفواتير والمدفوعات، كشف الحساب، إصدار فواتير</td></tr>
    <tr><td><b>محاسب</b></td><td>كل الفواتير والمدفوعات والكشوف، المتأخرين، تسجيل دفعة، إنشاء فاتورة (بموافقة)، اعتماد الدفعات</td><td>عروض الأسعار والـLeads</td></tr>
    <tr><td><b>مدير (أنت)</b></td><td>كل حاجة + اعتماد عروض الأسعار (كمدير تسعير) والفواتير الكبيرة</td><td>—</td></tr>
    <tr><td><b>رقم غير معروف</b></td><td>طلب عرض سعر (بيتحول لـLead تلقائياً)</td><td>أي بيانات — بيتحول لموظف</td></tr>
  </tbody></table></div>
</div>
<div class="card prose">
  <h2>جرّب السيناريو ده بالترتيب (10 دقايق)</h2>
  <ol>
    <li><b>كعميل (أحمد – شركة النخيل):</b> اكتب "عليا كام؟" ثم "هات آخر فاتورة" ثم "الفاتورة 1490 اتدفعت؟" — راقب مسار المعالجة وقارن الأرقام بشاشة الفواتير.</li>
    <li>اكتب "حولت 5000 ريال تحويل بنكي" → هيسألك على الفاتورة → جاوب "أقدم فاتورة" → أكّد. لاحظ إن الدفعة <b>مااتسجلتش</b> لسه: اتعملت طلب اعتماد وراح إشعار للمحاسب.</li>
    <li>روح لشاشة <b>الموافقات</b>، اختار "أحمد الشمري – محاسب" واعتمد الدفعة. ارجع للمحاكي: العميل وصله إشعار، والفاتورة اتحدثت في شاشة الفواتير، والعملية في سجل العمليات.</li>
    <li>اكتب "عايز عرض سعر لـ20 متر قص خرسانة سمك 30 سم في الرياض" → أكّد → العرض اتسعّر تلقائياً من قائمة الأسعار وراح لك كمدير تسعير للاعتماد. اعتمده من الموافقات وشوف العرض بيوصل للعميل.</li>
    <li>بدّل المرسل لـ<b>رقم غير معروف</b> واكتب "محتاج قص خرسانة" — هتشوف الـAI Sales Agent بيجمع البيانات ويعمل Lead.</li>
    <li>بدّل لـ<b>خالد (مبيعات)</b>: "بيانات شركة النخيل" ثم "هات آخر فاتورة لشركة النخيل" — لاحظ الرفض بسبب الصلاحيات. ثم "اعمل متابعة للعملاء اللي ما ردوش" وشوف الرسائل اللي اتبعتت.</li>
    <li>بدّل لـ<b>أحمد (محاسب)</b>: "مين عليه فلوس أكتر من 30 يوم؟" ثم "اعمل فاتورة لشركة الرواد بـ50,000".</li>
    <li>اكتب أي حاجة غريبة زي "الجو حر النهاردة" → هتروح لـ<b>تدخل بشري</b> ورد عليها من هناك.</li>
    <li>افتح <b>اختبار السيناريوهات</b> وشغّل الـ${SCENARIOS.length} سيناريو بالقواعد وبالـAI وقارن الدقة.</li>
    <li>افتح <b>مؤشرات الأداء</b> و<b>لوحة المتابعة</b> عشان تشوف الأرقام اللي الـBrief طالبها.</li>
  </ol>
  <h3>إيه اللي محاكاة وإيه اللي حقيقي؟</h3>
  <ul>
    <li><b>حقيقي:</b> منطق الـWorkflow كله، الصلاحيات، الـFlows متعددة الخطوات، الموافقات، الإشعارات، السجلات، الـKPIs، وفهم النية بالـAI (لو متاح).</li>
    <li><b>محاكاة:</b> واتساب نفسه (الشاشة دي بدل WhatsApp Business API)، النظام المحاسبي (قاعدة بيانات في المتصفح بدل البرنامج المحاسبي)، ملفات الـPDF (مجرد مرفق شكلي)، الأصوات والصور (مش موجودة في المرحلة دي).</li>
    <li>البيانات بتتحفظ في متصفحك أنت بس. زرار "إعادة ضبط" في الإعدادات بيرجّع العالم الافتراضي زي ما كان.</li>
  </ul>
  <h3>دورك دلوقتي</h3>
  <ul>
    <li>جرّب كل الأدوار وسجّل: إيه الردود اللي عجبتك، إيه اللي ناقص، وإيه الرسائل اللي الـAI فهمها غلط (صدّر نتائج الاختبار CSV).</li>
    <li>اكتب رسائل بأسلوب العملاء الحقيقيين (زي ما بيكتبوا فعلاً على الواتساب) — دي أهم مدخل للمرحلة الجاية.</li>
    <li>قرّر قواعد الشغل: مين يعتمد إيه، حد الفاتورة اللي يحتاج موافقة، الخدمات وأسعارها المبدئية، شكل الردود.</li>
    <li>حدد البرنامج المحاسبي المستهدف وهل ليه API — ده اللي هيحدد شكل الـIntegration في المرحلة 5.</li>
  </ul>
</div>
</div>`;

/* ================= SETTINGS ================= */
R.settings = () => { const s = S.settings; const ap = s.approvals;
  return `<div class="grid c2" style="align-items:start">
  <div class="card"><h3 style="margin-bottom:10px">محرك الـAI</h3>
    <div class="steps-list">
      <label class="chk"><input type="radio" name="aimode" value="auto" ${s.aiMode==='auto'?'checked':''}> <span><b>تلقائي</b> — Claude لو متاح، وإلا محرك القواعد (موصى به)</span></label>
      <label class="chk"><input type="radio" name="aimode" value="real" ${s.aiMode==='real'?'checked':''}> <span><b>Claude فقط</b> — لو فشل هيرجع للقواعد ويسجّل الفشل</span></label>
      <label class="chk"><input type="radio" name="aimode" value="rules" ${s.aiMode==='rules'?'checked':''}> <span><b>قواعد فقط</b> — بدون أي استدعاء AI (أوفلاين)</span></label>
    </div>
    <p class="small muted" style="margin-top:8px">حالة الـAI: ${AI.status} · استدعاءات: ${AI.calls} · فشل: ${AI.fails}</p>
    <h3 style="margin:16px 0 10px">الشركة</h3>
    <div class="grid c2">
      <div class="field"><label>اسم الشركة</label><input id="st-company" value="${esc(s.companyName)}"></div>
      <div class="field"><label>اسم المساعد</label><input id="st-bot" value="${esc(s.botName)}"></div>
      <div class="field"><label>العملة</label><input id="st-cur" value="${esc(s.currency)}"></div>
      <div class="field"><label>أيام التأخر الافتراضية لـ"مين عليه فلوس"</label><input id="st-overdue" type="number" value="${s.overdueDays}"></div>
    </div>
    <h3 style="margin:16px 0 10px">المحاكاة والتكلفة</h3>
    <div class="grid c2">
      <div class="field"><label>تكلفة الرسالة الصادرة (ريال) — تقدير WhatsApp</label><input id="st-msgcost" type="number" step="0.01" value="${s.msgCost}"></div>
      <div class="field"><label>تكلفة استدعاء AI (ريال)</label><input id="st-aicost" type="number" step="0.01" value="${s.aiCost}"></div>
      <div class="field"><label>دقائق المعالجة اليدوية لكل طلب</label><input id="st-manual" type="number" value="${s.manualMinutes}"></div>
      <div class="field"><label>تأخير "يكتب…" (ms)</label><input id="st-typing" type="number" value="${s.typingDelay}"></div>
    </div>
  </div>
  <div class="card"><h3 style="margin-bottom:10px">العمليات اللي تحتاج اعتماد بشري</h3>
    <div class="steps-list">
      <label class="chk"><input type="checkbox" data-ap="CREATE_INVOICE" ${ap.CREATE_INVOICE?'checked':''}> إصدار فاتورة (يعتمدها المحاسب — أو المدير لو الطالب محاسب)</label>
      <label class="chk"><input type="checkbox" data-ap="RECORD_PAYMENT" ${ap.RECORD_PAYMENT?'checked':''}> ترحيل دفعة (يعتمدها المحاسب)</label>
      <label class="chk"><input type="checkbox" data-ap="SEND_QUOTATION" ${ap.SEND_QUOTATION?'checked':''}> إرسال عرض سعر بعد التسعير التلقائي (يعتمده المدير / مدير التسعير)</label>
      <label class="chk"><input type="checkbox" data-ap="CREATE_CUSTOMER" ${ap.CREATE_CUSTOMER?'checked':''}> إضافة عميل جديد (يعتمده المدير)</label>
    </div>
    <div class="field" style="margin-top:10px"><label>حد الفاتورة اللي يحتاج اعتماد حتى لو الخيار متقفل (ريال)</label><input id="st-thr" type="number" value="${s.approvalThreshold}"></div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="st-save">💾 حفظ الإعدادات</button></div>
    <h3 style="margin:20px 0 10px">البيانات</h3>
    <div class="row">
      <button class="btn" id="st-export">⬇️ تصدير كل البيانات (JSON)</button>
      <button class="btn" id="st-clear-conv">🧹 مسح المحادثات والسجلات فقط</button>
      <button class="btn danger" id="st-reset">↺ إعادة ضبط العالم الافتراضي بالكامل</button>
    </div>
    <p class="small muted" style="margin-top:8px">إعادة الضبط بترجّع نفس البيانات الأصلية (مولّد ثابت) وبتمسح كل اللي عملته.</p>
  </div></div>`;
};
AFTER.settings = () => {
  $('#st-save').onclick = () => { const s = S.settings; s.aiMode = ($('input[name=aimode]:checked')||{}).value||'auto'; s.companyName=$('#st-company').value; s.botName=$('#st-bot').value; s.currency=$('#st-cur').value; s.overdueDays=+$('#st-overdue').value||30; s.msgCost=+$('#st-msgcost').value||0; s.aiCost=+$('#st-aicost').value||0; s.manualMinutes=+$('#st-manual').value||0; s.typingDelay=+$('#st-typing').value||0; s.approvalThreshold=+$('#st-thr').value||0; $$('input[data-ap]').forEach(c => s.approvals[c.dataset.ap] = c.checked); save(); toast('تم الحفظ'); render(); };
  $('#st-export').onclick = () => downloadText('hesabo_data.json', JSON.stringify(S, null, 1));
  $('#st-clear-conv').onclick = () => { S.conversations = {}; S.requests = []; S.handoffs = []; S.testResults = null; UI.chat.trace=null; save(); toast('تم المسح'); render(); };
  $('#st-reset').onclick = () => { if (!UI.confirmReset){ UI.confirmReset = true; toast('اضغط مرة تانية للتأكيد'); setTimeout(()=>UI.confirmReset=false, 4000); return; } resetAll(); UI.chat = { phone:null, trace:null, typing:false, busy:false }; toast('تمت إعادة الضبط'); render(); };
};

/* ================= BOOT ================= */
load();
$$('.nav-item').forEach(b => b.onclick = () => go(b.dataset.screen));
window.addEventListener('hashchange', () => { const h = location.hash.replace('#',''); if (SCREENS[h] && h!==UI.screen){ UI.screen=h; render(); } });
(function(){ const h = location.hash.replace('#',''); UI.screen = SCREENS[h] ? h : 'chat'; })();
render();
</script>
